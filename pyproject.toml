[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boe-insights-mcp"
version = "0.1.0.dev0"
description = "MCP server with analytical tools over Spain's BOE (Boletín Oficial del Estado) open data: law version history, amendment analysis and legislative trends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Bejar" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "boe", "spain", "legislation", "open-data", "llm", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    # Narrow on purpose: login.py overrides private FastMCP internals (OAuth proxy), which can
    # change in any minor release. Before raising this range, re-run the sign-in tests
    # (tests/test_login*.py) and re-read login.py against the new FastMCP source.
    "fastmcp>=4.2.4,<4.3",
    "httpx",
    "pydantic>=2",
    "diskcache",
    "platformdirs",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/davidbejar/boe-insights-mcp"
Repository = "https://github.com/davidbejar/boe-insights-mcp"
Issues = "https://github.com/davidbejar/boe-insights-mcp/issues"

[project.scripts]
boe-insights-mcp = "boe_insights_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "pyright",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boe_insights_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["boe_insights_mcp", "tests"]

[tool.ruff.format]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: tests that call the real BOE API (deselected by default)",
]
addopts = "-m 'not live'"
