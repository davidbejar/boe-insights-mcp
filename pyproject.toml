[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boe-insights-mcp"
version = "0.1.0.dev0"
description = "MCP server with analytical tools over Spain's BOE (Boletín Oficial del Estado) open data: law version history, amendment analysis and legislative trends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Bejar" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "boe", "spain", "legislation", "open-data", "llm", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.2,<5",
    "httpx",
    "pydantic>=2",
    "diskcache",
    "platformdirs",
]

[project.urls]
Homepage = "https://github.com/davidbejar/boe-insights-mcp"
Repository = "https://github.com/davidbejar/boe-insights-mcp"
Issues = "https://github.com/davidbejar/boe-insights-mcp/issues"

[project.scripts]
boe-insights-mcp = "boe_insights_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "pyright",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boe_insights_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call the real BOE API (deselected by default)",
]
addopts = "-m 'not live'"
