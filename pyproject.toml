[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1.0"]
build-backend = "hatchling.build"

[project]
name = "boe-insights-mcp"
version = "0.1.0rc1"
description = "MCP server with analytical tools over Spain's BOE (Boletín Oficial del Estado) open data: law version history, amendment analysis and legislative trends."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Bejar" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "boe", "spain", "legislation", "open-data", "llm", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    # Narrow on purpose: login.py overrides private FastMCP internals (OAuth proxy), which can
    # change in any minor release. Before raising this range, re-run the sign-in tests
    # (tests/test_login*.py) and re-read login.py against the new FastMCP source.
    "fastmcp>=4.2.4,<4.3",
    "httpx",
    "pydantic>=2",
    "diskcache",
    "platformdirs",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/davidbejar/boe-insights-mcp"
Repository = "https://github.com/davidbejar/boe-insights-mcp"
Issues = "https://github.com/davidbejar/boe-insights-mcp/issues"

[project.scripts]
boe-insights-mcp = "boe_insights_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "pyright",
    "types-defusedxml>=0.7.0.20260504",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-include-markdown-plugin>=7.3,<8",
    "mkdocs-material>=9.7,<10",
    "mkdocs-static-i18n>=1.3,<2",
]

# PyPI renders the README outside the repository, so relative image paths and links would break.
# The README itself stays repository-relative (it is read on GitHub and by the docs build);
# these substitutions rewrite it at build time only. "#anchor" links and absolute URLs are
# untouched because the patterns require the target to start with a path character that is
# neither "#", "/" nor a URL scheme.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Image sources (src= and srcset=) -> raw files on the main branch.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\b(?:src|srcset)=")(?![a-zA-Z][a-zA-Z0-9+.-]*:|/|#)([^"]+)"'
replacement = '\1https://raw.githubusercontent.com/davidbejar/boe-insights-mcp/main/\2"'

# HTML links.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\bhref=")(?![a-zA-Z][a-zA-Z0-9+.-]*:|/|#)([^"]+)"'
replacement = '\1https://github.com/davidbejar/boe-insights-mcp/blob/main/\2"'

# Markdown links: matching on "](" alone also covers badges, where the link wraps an image.
# (A relative Markdown image would wrongly become a blob link; the README has none.)
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\()(?![a-zA-Z][a-zA-Z0-9+.-]*:|/|#)([^)\s]+)\)'
replacement = '\1https://github.com/davidbejar/boe-insights-mcp/blob/main/\2)'

# PyPI files are permanent and the sdist is labelled MIT, so ship only what is needed to build
# and understand the package: no agent tooling (.claude/, CLAUDE.md, with third-party licensed
# files), CI config, docs sources or test fixtures. README.md is needed by the readme plugin.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/README.es.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boe_insights_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["boe_insights_mcp", "tests"]

[tool.ruff.format]

[tool.pyright]
include = ["src", "tests", "docs_build"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: tests that call the real BOE API (deselected by default)",
]
addopts = "-m 'not live'"
