# Resúmenes en español de las páginas de referencia (herramientas, recursos y prompts).
#
# Cada tabla se llama [tipo.nombre] y lleva:
#   summary     - una o dos frases en español, redactadas a mano.
#   source_hash - huella del texto en inglés (descripción y parámetros) con el que se escribió
#                 el resumen. Si ese texto cambia, la generación de la documentación falla hasta
#                 que alguien relea el resumen y ejecute, para esa entrada y solo para ella:
#                     python -m docs_build --refresh tools.nombre
#                 `python -m docs_build --hash tools.nombre` solo muestra la huella.
#
# No cambies source_hash a mano ni lo actualices sin releer el resumen.

# --- Herramientas -------------------------------------------------------------------------------

[tools.search_legislation]
summary = "Busca normas de la legislación consolidada por título, texto, rango, departamento, ámbito o fecha de publicación. Sin filtros devuelve las normas publicadas más recientemente, paginadas."
source_hash = "18249127bfcb"

[tools.resolve_reference]
summary = "Convierte el nombre o el número de una norma (por ejemplo, Ley 40/2015) en su identificador del BOE, que necesitan las herramientas de normas y artículos. Indica si hay una coincidencia, varias candidatas o ninguna."
source_hash = "0fc16bf947ae"

[tools.get_law_overview]
summary = "Resume una norma: título, rango, fechas, estado (vigente, derogada, etc.) con una nota en inglés, y cuántas normas la han modificado o ha modificado ella. El estado se deduce de los indicadores y referencias del BOE y es solo orientativo: `in_force` no significa que sigan vigentes todas sus disposiciones."
source_hash = "55fccc3a02d5"

[tools.find_codes]
summary = "Busca por nombre los códigos de departamento, materia o rango que usa el BOE. Sirve para obtener los valores de los filtros `department_code` y `subject_code` de `search_legislation`."
source_hash = "0b4a177352a2"

[tools.get_amendment_history]
summary = "Lista las normas posteriores que han modificado, derogado o afectado de otro modo a una norma en su conjunto, de la más reciente a la más antigua, con recuentos por grupo y por año. Nombra las normas, no los artículos afectados."
source_hash = "3f123599f6f8"

[tools.read_article]
summary = "Devuelve el texto de un artículo o disposición de una norma en su redacción vigente en una fecha (por defecto, hoy). Si el artículo no se identifica con claridad, ofrece bloques candidatos para repetir la consulta."
source_hash = "a898dec8df95"

[tools.compare_article_versions]
summary = "Compara el texto de un artículo en dos fechas: párrafos añadidos, suprimidos y reformulados, diferencias línea a línea y normas que lo modificaron entre ambas fechas. El resultado tiene un límite de tamaño."
source_hash = "42197b1eaa77"

[tools.get_article_history]
summary = "Lista las versiones de un artículo: desde cuándo rige cada una, qué norma la introdujo y qué párrafos cambiaron respecto a la anterior. Devuelve como máximo las 60 versiones más recientes."
source_hash = "0924f03d08e5"

[tools.get_law_structure]
summary = "Devuelve el índice de una norma (libros, títulos, capítulos, secciones y epígrafes de artículos), cada uno con el identificador de bloque que usan las herramientas de artículos. En los códigos muy extensos hay que paginar o pedir solo la estructura, sin artículos (`detail` = `headings`)."
source_hash = "a7f7fb371917"

[tools.legislation_over_time]
summary = "Cuenta las normas por año, trimestre o mes, con la opción de desglosarlas por rango, departamento o ámbito. Solo cubre la legislación consolidada; la primera vez descarga el catálogo y tarda unos treinta segundos."
source_hash = "0bc57a6511e4"

[tools.top_departments]
summary = "Ordena los departamentos (ministerios, Jefatura del Estado, comunidades autónomas) según el número de normas que han dictado en un periodo, para saber quién legisla más sobre un asunto."
source_hash = "7adc33385e63"

[tools.compare_topics]
summary = "Compara con qué frecuencia aparecen entre dos y cinco temas en la legislación a lo largo del tiempo. Cada tema se define por palabras del título, palabras del texto o un código de materia."
source_hash = "dd616fd64241"

[tools.explain_spike]
summary = "Explica por qué un periodo tiene un número inusualmente alto de normas: qué rangos, departamentos y ámbitos crecieron frente a los periodos anteriores, con las normas concretas. Sin `period_key`, elige el pico más fuerte del intervalo."
source_hash = "3ffd31115dea"

[tools.most_amended_laws]
summary = "Ordena las normas de un conjunto filtrado según cuántas normas posteriores las han modificado. Examina un número limitado de normas por llamada, así que hay que repetirla mientras el resultado no esté completo."
source_hash = "b2db041642c9"

[tools.get_daily_summary]
summary = "Devuelve todo lo que el BOE publicó un día (disposiciones, nombramientos, subvenciones y anuncios) por sección y departamento. Abarca todo el diario oficial desde el 1 de septiembre de 1960, no solo la legislación consolidada; sin fecha, da el último número."
source_hash = "9ff8f2cfd7cf"

[tools.scan_gazette]
summary = "Busca, en un intervalo de hasta 31 días, las publicaciones del BOE cuyo título contenga las palabras indicadas (palabras completas; el singular y el plural coinciden) o que pertenezcan a una sección o departamento. Solo compara títulos; si el resultado no está completo, hay que repetir la llamada."
source_hash = "6b3f3ce8a897"

[tools.verify_citation]
summary = "Comprueba citas de normas españolas con el texto consolidado: si existen la norma y el artículo, en qué estado estaban en una fecha y si las palabras citadas coinciden con el texto vigente o con una versión anterior. Compara palabras, no significado, y no se pronuncia sobre la corrección jurídica."
source_hash = "7ae7294db201"

[tools.explore_amendment_chain]
summary = "Sigue las modificaciones entre normas hasta tres niveles: las normas que modificaron una norma y las que modificaron a estas, o las que una norma modificó. Una norma a dos niveles modificó la intermedia, no necesariamente las partes que afectan a la de partida. Examina un número limitado de normas por llamada; si el resultado no está completo, hay que repetirla."
source_hash = "5ba2dd4a7217"

[tools.save_search]
summary = "Guarda una búsqueda para volver a consultarla: publicaciones del BOE por palabras del título, sección o departamento, o una norma concreta cuyas modificaciones y resoluciones judiciales se quieren seguir. No envía nada por sí sola; las novedades se ven con `check_saved_searches`."
source_hash = "5cf7b1d92d23"

[tools.list_saved_searches]
summary = "Muestra las búsquedas guardadas con sus filtros y la fecha de su última comprobación."
source_hash = "479db1ec4826"

[tools.check_saved_searches]
summary = "Muestra las novedades de las búsquedas guardadas desde la última comprobación y marca como visto lo que muestra. Abarca como máximo los últimos 31 días y 60 elementos por llamada, así que hay que repetirla mientras el resultado no esté completo. Con `since` vuelve a leer las búsquedas del diario hasta 90 días atrás sin marcar nada."
source_hash = "f31d336bd08b"

[tools.edit_saved_search]
summary = "Cambia el nombre de una búsqueda guardada o sus filtros del diario oficial; conserva el marcador de la última comprobación."
source_hash = "0ddf60cfcb05"

[tools.delete_saved_search]
summary = "Elimina una búsqueda guardada. No se puede deshacer."
source_hash = "c625dcb1830f"

# --- Recursos -----------------------------------------------------------------------------------

[resources.saved_searches]
summary = "La lista de búsquedas guardadas de quien usa el servidor, con sus filtros y la fecha de su última comprobación."
source_hash = "93ee51c353ed"

[resources.law]
summary = "Resumen de una norma consolidada, a partir de su identificador del BOE: estado, fechas, departamento y recuento de modificaciones."
source_hash = "81f7876b9f64"

[resources.article]
summary = "Texto vigente de un artículo de una norma consolidada, a partir del identificador de la norma y del bloque del artículo."
source_hash = "e78372f96b48"

[resources.gazette_day]
summary = "Lo publicado por el BOE en un día (fecha ISO), agrupado por sección y departamento. Ofrece las 100 primeras publicaciones del día."
source_hash = "940e19315134"

[resources.codes]
summary = "Todos los códigos y nombres de una tabla del BOE: departamentos o rangos. Los códigos de materia se consultan con `find_codes`."
source_hash = "e2d9e2e9a77a"

# --- Prompts ------------------------------------------------------------------------------------

[prompts.explain_law]
summary = "Petición preparada, en inglés, para explicar una ley española: qué regula, su estado, cómo se organiza y cuántas veces se ha modificado."
source_hash = "399aad8ea321"

[prompts.explicar_ley]
summary = "Versión en español de la petición para explicar una ley española: qué regula, su estado, cómo se organiza y cuántas veces se ha modificado."
source_hash = "68dbea5ea00e"

[prompts.article_changes]
summary = "Petición preparada, en inglés, para ver cómo ha cambiado un artículo de una ley española con el tiempo y qué normas lo modificaron; admite una fecha de inicio opcional."
source_hash = "d84cbc269e9f"

[prompts.cambios_articulo]
summary = "Versión en español de la petición para ver cómo ha cambiado un artículo de una ley española con el tiempo y qué normas lo modificaron; admite una fecha de inicio opcional."
source_hash = "eb1b960afea5"

[prompts.check_citations]
summary = "Petición preparada, en inglés, para comprobar las citas de leyes españolas de un texto con la legislación consolidada."
source_hash = "424aea5d5f26"

[prompts.comprobar_citas]
summary = "Versión en español de la petición para comprobar las citas de leyes españolas de un texto con la legislación consolidada."
source_hash = "7eb7d6851876"

[prompts.gazette_briefing]
summary = "Petición preparada, en inglés, para resumir lo que el BOE ha publicado sobre un tema en los últimos días; el número de días es opcional."
source_hash = "f472ba0b300a"

[prompts.resumen_boe]
summary = "Versión en español de la petición para resumir lo que el BOE ha publicado sobre un tema en los últimos días; el número de días es opcional."
source_hash = "877b2fde4f1c"
