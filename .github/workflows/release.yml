# Releases boe-insights-mcp: PyPI package, container image, GitHub release and docs site.
#
# The only trigger is pushing a tag that matches v* (for example v0.1.0 or v0.1.0rc1). The tag
# must equal the version in pyproject.toml with a leading "v"; the build job fails otherwise, so
# nothing is published from a mismatched tag. See RELEASING.md for the full procedure and the
# one-time setup (PyPI trusted publisher, protected `pypi` environment, GHCR visibility).
#
# Job order: build -> pypi (waits for a reviewer to approve the `pypi` environment) -> image,
# github-release and site, which run in parallel. A failure after pypi leaves the package
# published: PyPI versions can never be reused, so the fix is a new version (RELEASING.md).
#
# Third-party actions are pinned to a full commit SHA (the version is in the trailing comment);
# GitHub-owned actions (actions/*) stay on major tags, as in the other workflows.

name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; each job below asks only for what it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # The tag is the single trigger, so verify it against the package metadata before anything
      # is built or published. The tag name is passed through the environment, never interpolated
      # into the script.
      - name: Check the tag against pyproject.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
          # PEP 440 pre-release: an a, b, rc or dev segment right after a digit (0.1.0rc1, 1.0.0a2, 1.0.dev3).
          if printf '%s' "$version" | grep -Eq '[0-9](a|b|rc|\.?dev)[0-9]*'; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      # A fresh virtual environment outside the project, so the test sees only what the wheel
      # declares (a missing dependency or data file shows up here, not on PyPI).
      - name: Smoke test the built wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/boe-insights-mcp" --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Protected by a required reviewer; also the environment name registered on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/boe-insights-mcp/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC); no API token exists anywhere

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    name: Publish container image
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The exact version is always tagged. `latest` and MAJOR.MINOR move only for a final release,
      # so a pre-release never becomes what `docker pull` fetches by default.
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          image=ghcr.io/davidbejar/boe-insights-mcp
          {
            echo "tags<<EOF"
            echo "$image:$VERSION"
            if [ "$PRERELEASE" = "false" ]; then
              echo "$image:latest"
              echo "$image:${VERSION%.*}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    name: Create GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/$REPO/blob/$TAG/CHANGELOG.md) for what changed in this release." \
            "${flags[@]}"

  site:
    name: Documentation site
    # Only final releases update the public site; a pre-release leaves it as it is.
    if: needs.build.outputs.prerelease == 'false'
    needs: [build, pypi]
    # Reusable workflow: builds from the tagged commit and deploys it (see docs.yml).
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
