# Publishes the documentation site (MkDocs Material) to GitHub Pages.
#
# Two triggers:
#  - workflow_dispatch: run by hand (Actions tab -> "Documentation site" -> "Run workflow").
#  - workflow_call: called by release.yml for a final (non-pre-release) version, so the site is
#    built from the tagged commit. There is deliberately no push or schedule trigger.
#
# The deploy job runs only for refs/heads/main (a manual run) or a v* tag (the release call);
# any other ref (a feature branch, say) only builds, as a check that the site compiles.
#
# One-time manual steps before the first deployment:
#  1. Settings -> Pages -> "Build and deployment": set Source to "GitHub Actions".
#  2. Settings -> Environments -> github-pages -> "Deployment branches and tags": the environment
#     restricts which refs may deploy (by default only the default branch), so add a rule of ref
#     type Tag with the pattern v*. Without it the release-triggered deployment is rejected.

name: Documentation site

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One deployment at a time. A run already in progress is never cancelled: a half-finished
# deployment could leave the site in an inconsistent state, so later runs wait in the queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Same install and build as the docs job in ci.yml: the project plus the docs group only.
      - name: Install dependencies
        run: uv sync --no-dev --group docs

      - name: Build documentation (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --no-sync mkdocs build --strict

      # MkDocs writes to ./site (its default site_dir), not the action's default ./_site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Publish only from the default branch or a release tag; any other ref stops after the build.
    # In a workflow_call run, github.ref is the caller's ref (the pushed tag).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy-pages publishes the artifact
      id-token: write # deploy-pages verifies the deployment source via OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
